[package]
name = "pipelite"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.22"
dialoguer = "0.12"
anyhow = "1.0"
thiserror = "2.0"
colored = "3.1"
indicatif = "0.18"
comfy-table = "7.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
